<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Russitex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Mulish:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --azul-oficio:#2C5C7C; --azul-profundo:#1C3D54; --ladrillo:#A95445; --ladrillo-osc:#8F4537;
  --arena:#D8C2A1; --crema:#FDFBF7; --crema-osc:#F1EADC; --tinta:#3B302A; --gris-calido:#6E665C;
  --linea:#E0D8CB; --azul-claro:#E8EFF4; --verde:#5B7A52; --rojo:#9E3B2E; --ambar:#D89A3C; --verde-wa:#25D366;
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px; --r-pill:100px;
  --sh-sm:0 2px 8px rgba(59,48,42,0.06); --sh-md:0 6px 20px rgba(59,48,42,0.10); --sh-lg:0 16px 38px rgba(59,48,42,0.14);
  --f-head:'Fraunces', Georgia, serif; --f-body:'Mulish', system-ui, sans-serif;
  /* Alias de nombres antiguos -> paleta aprobada */
  --azul:#2C5C7C; --azul-oscuro:#1C3D54; --terracota:#A95445; --terracota-cl:#C16A52; --terracota-bg:#F6EBE8;
  --carbon:#3B302A; --gris:#6E665C; --gris-claro:#E0D8CB;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }
body { font-family: 'Mulish', sans-serif; background: var(--crema); color: var(--carbon); min-height: 100vh; display: flex; flex-direction: column; }
@keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

/* ════════ COMPONENTES GLOBALES APROBADOS ════════ */
/* ── TOPBAR ROTANTE HORIZONTAL ── */
.topbar {
  background: var(--azul-profundo);
  height: 38px; overflow: hidden;
  position: relative;
}
.topbar-inner { position: relative; width: 100%; height: 100%; }
.topbar-msg {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 0.4rem;
  font-size: 0.78rem; color: rgba(255,255,255,0.82);
  letter-spacing: 0.02em; white-space: nowrap;
  padding: 0 1rem; text-align: center;
  opacity: 0;
}
.topbar-msg strong { color: #fff; font-weight: 600; }
/* Conjuntos superpuestos: escritorio/tablet (2 mensajes) y celular (3 mensajes) */
.topbar-set { position: absolute; inset: 0; }
.topbar-set-mobile { display: none; }
/* Escritorio/tablet: 2 mensajes, bucle 10s */
.topbar-set-desktop .topbar-msg:nth-child(1) { animation: slideMsg 10s ease-in-out 0s infinite; }
.topbar-set-desktop .topbar-msg:nth-child(2) { animation: slideMsg 10s ease-in-out 5s infinite; }

@keyframes slideMsg {
  0%   { opacity: 0; transform: translateX(60px); }
  8%   { opacity: 1; transform: translateX(0); }
  42%  { opacity: 1; transform: translateX(0); }
  50%  { opacity: 0; transform: translateX(-60px); }
  100% { opacity: 0; transform: translateX(60px); }
}

/* ── HEADER ── */
header {
  position: sticky; top: 0; z-index: 300;
  background: rgba(250,246,238,0.96); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--linea);
}
.header-inner { display: flex; align-items: center; padding: 0 5%; height: 68px; gap: 2rem; }
.logo {
  font-family: var(--f-head); font-size: 1.6rem; font-weight: 600;
  color: var(--azul-oficio); text-decoration: none; letter-spacing: -0.01em; white-space: nowrap;
}
.logo span { color: var(--ladrillo); }
nav { display: flex; gap: 1.7rem; flex: 1; position: relative; }
nav a {
  text-decoration: none; color: var(--tinta);
  font-size: 0.92rem; font-weight: 500; white-space: nowrap; transition: color 0.2s;
  display: flex; align-items: center; gap: 0.3rem; padding: 0 0 4px; position: relative;
}
nav a:not(.active)::after {
  content: ''; position: absolute; left: 0; right: 100%; bottom: -2px;
  height: 2px; background: var(--ladrillo); transition: right 0.25s ease;
}
nav a:hover { color: var(--azul-oficio); }
nav a:hover:not(.active)::after { right: 0; }
nav a.active { color: var(--azul-oficio); font-weight: 700; }
nav a.active::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -2px;
  height: 2px; background: var(--ladrillo); border-radius: 2px;
}
.nav-catalog-wrap { position: relative; }
.nav-catalog-wrap > a svg { transition: transform 0.2s; }
.nav-catalog-wrap:hover > a { color: var(--azul-oficio); }
.nav-catalog-wrap:hover > a svg { transform: rotate(180deg); }

/* ── MEGA MENU ── */
.mega-menu {
  position: absolute; top: calc(100% + 16px); left: -2rem; width: 620px;
  background: #fff; border-radius: var(--r-xl);
  box-shadow: var(--sh-lg), 0 0 0 1px var(--linea);
  padding: 1.6rem; opacity: 0; pointer-events: none;
  transform: translateY(8px); transition: opacity 0.22s ease, transform 0.22s ease; z-index: 400;
}
.nav-catalog-wrap:hover .mega-menu { opacity: 1; pointer-events: all; transform: translateY(0); }
.mega-menu-title {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--gris-calido); margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--linea);
}
.mega-cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 1.2rem; }
.mega-cat {
  display: flex; flex-direction: column; align-items: center; gap: 0.45rem;
  padding: 0.9rem 0.5rem; border-radius: var(--r-md); cursor: pointer;
  text-decoration: none; transition: all 0.18s; border: 1.5px solid transparent;
}
.mega-cat:hover { background: var(--azul-claro); border-color: var(--azul-oficio); transform: translateY(-2px); }
.mega-cat:not(.active)::after, .mega-cat:hover:not(.active)::after { content: none; }
.mega-cat-icon { color: var(--azul-oficio); display: flex; }
.mega-cat-icon svg { width: 26px; height: 26px; stroke: currentColor; stroke-width: 0.75px; stroke-linejoin: round; stroke-linecap: round; }
.mega-cat-icon svg * { vector-effect: non-scaling-stroke; }
.mega-cat-icon svg[viewBox^="0 0 682"] { stroke-width: 1.3px; }
.mega-cat[data-filter="cierres"] .mega-cat-icon svg { stroke-width: 1.5px; }
.mega-cat-name { font-size: 0.78rem; font-weight: 600; color: var(--tinta); text-align: center; line-height: 1.2; }
.mega-cat-count { font-size: 0.68rem; color: var(--gris-calido); }
.mega-mobile { display: none; }
.mega-footer { padding-top: 1rem; border-top: 1px solid var(--linea); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.mega-ver-todo {
  display: inline-flex; align-items: center; gap: 0.4rem;
  background: var(--azul-oficio); color: #fff; text-decoration: none;
  padding: 0.55rem 1.2rem; border-radius: var(--r-pill);
  font-size: 0.82rem; font-weight: 700; transition: background 0.2s, transform 0.2s;
}
.mega-ver-todo:hover { background: var(--azul-profundo); color: #fff; transform: translateY(-1px); }
.mega-ver-todo svg { width: 15px; height: 15px; }
.mega-promo { font-size: 0.78rem; color: var(--gris-calido); }
.mega-promo strong { color: var(--ladrillo); }

/* Header icons + hamburger */
.header-icons { display: flex; align-items: center; gap: 0.3rem; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--azul-oficio); transition: background 0.2s;
}
.icon-btn:hover { background: var(--azul-claro); }
.icon-btn svg { width: 19px; height: 19px; }
.cart-btn { position: relative; }
.cart-badge {
  position: absolute; top: 3px; right: 3px; min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: var(--r-pill); background: var(--ladrillo); color: #fff;
  font-size: 0.6rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.nav-toggle {
  display: none; width: 40px; height: 40px; border-radius: 50%;
  background: none; border: none; cursor: pointer;
  align-items: center; justify-content: center; color: var(--azul-oficio);
}
.nav-toggle svg { width: 22px; height: 22px; }

/* ── BÚSQUEDA EN CABECERA (desplegable) ── */
.icon-btn.active { background: var(--azul-claro); color: var(--azul-oficio); }
.header-search {
  position: absolute; top: 100%; left: 0; right: 0;
  background: rgba(250,246,238,0.98); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--linea); box-shadow: var(--sh-md);
  max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height 0.28s ease, opacity 0.2s ease;
}
.header-search.open { max-height: 130px; opacity: 1; }
.header-search-inner {
  max-width: 720px; margin: 0 auto; padding: 0.9rem 5%;
  display: flex; align-items: center; gap: 0.6rem;
}
.header-search-box { position: relative; flex: 1; }
.header-search-box > svg {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; color: var(--gris-calido); pointer-events: none;
}
.header-search-input {
  width: 100%; height: 46px; padding: 0 16px 0 46px;
  border: 1.5px solid var(--linea); border-radius: var(--r-pill);
  background: #fff; font-family: var(--f-body); font-size: 0.98rem; color: var(--tinta);
  outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
.header-search-input:focus { border-color: var(--azul-oficio); box-shadow: 0 0 0 3px rgba(44,92,124,0.12); }
.header-search-input::placeholder { color: var(--gris-calido); }
.header-search-close {
  width: 44px; height: 44px; border-radius: 50%; border: none; background: none; cursor: pointer;
  color: var(--azul-oficio); display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.2s;
}
.header-search-close:hover { background: var(--azul-claro); }
.header-search-close svg { width: 20px; height: 20px; }


/* ── MAIN ── */
.auth-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
.auth-card { background: white; border-radius: var(--r-xl); border: 1px solid var(--gris-claro); padding: 2.8rem; width: 100%; max-width: 440px; box-shadow: var(--sh-lg); animation: fadeUp 0.4s ease both; }

/* ── TABS ── */
.auth-tabs { display: flex; background: var(--crema-osc); border-radius: var(--r-md); padding: 4px; margin-bottom: 2rem; }
.auth-tab { flex: 1; padding: 0.65rem; border: none; background: none; border-radius: var(--r-sm); font-family: 'Mulish', sans-serif; font-size: 0.88rem; font-weight: 600; color: var(--gris); cursor: pointer; transition: all 0.22s; }
.auth-tab.active { background: white; color: var(--azul); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

/* ── PANE ── */
.auth-pane { display: none; animation: fadeUp 0.3s ease both; }
.auth-pane.active { display: block; }

.auth-title { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 700; color: var(--azul-oscuro); margin-bottom: 0.4rem; }
.auth-subtitle { font-size: 0.85rem; color: var(--gris); line-height: 1.6; margin-bottom: 1.8rem; }

/* ── SOCIAL BUTTONS ── */
.social-buttons { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1.4rem; }
.btn-social { display: flex; align-items: center; justify-content: center; gap: 0.9rem; width: 100%; padding: 0.8rem 1.2rem; background: white; border: 1.5px solid var(--gris-claro); border-radius: var(--r-sm); font-family: 'Mulish', sans-serif; font-size: 0.88rem; font-weight: 600; color: var(--carbon); cursor: pointer; transition: all 0.2s; }
.btn-social:hover { border-color: var(--azul); background: var(--azul-claro); }
.btn-social-icon { width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

/* Google icon */
.google-icon { width: 20px; height: 20px; }

/* Outlook icon */
.outlook-icon { width: 20px; height: 20px; }

/* ── DIVIDER ── */
.auth-divider { display: flex; align-items: center; gap: 0.8rem; margin: 1.4rem 0; }
.auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--gris-claro); }
.auth-divider span { font-size: 0.75rem; color: var(--gris); white-space: nowrap; }

/* ── FORM ── */
.form-fields { display: flex; flex-direction: column; gap: 1.1rem; margin-bottom: 1.4rem; }
.form-group { display: flex; flex-direction: column; gap: 0.35rem; }
.form-label { font-size: 0.78rem; font-weight: 600; color: var(--carbon); }
.form-input { padding: 0.8rem 1rem; border: 1.5px solid var(--gris-claro); border-radius: var(--r-sm); font-family: 'Mulish', sans-serif; font-size: 0.88rem; color: var(--carbon); outline: none; transition: border-color 0.2s, box-shadow 0.2s; background: var(--crema); width: 100%; }
.form-input:focus { border-color: var(--azul); background: white; box-shadow: 0 0 0 3px rgba(47,95,143,0.07); }
.form-input::placeholder { color: var(--gris); }

/* Password field with toggle */
.input-wrap { position: relative; }
.input-wrap .form-input { padding-right: 2.8rem; }
.pwd-toggle { position: absolute; right: 0.9rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--gris); padding: 0; display: flex; align-items: center; transition: color 0.2s; }
.pwd-toggle:hover { color: var(--azul); }
.pwd-toggle svg { width: 17px; height: 17px; fill: currentColor; }

.form-footer-row { display: flex; align-items: center; justify-content: space-between; margin-top: -0.4rem; }
.remember-label { display: flex; align-items: center; gap: 0.45rem; font-size: 0.78rem; color: var(--gris); cursor: pointer; }
.remember-label input { accent-color: var(--azul); }
.forgot-link { font-size: 0.78rem; color: var(--azul); text-decoration: none; font-weight: 500; }
.forgot-link:hover { text-decoration: underline; }

/* ── SUBMIT ── */
.btn-submit { width: 100%; padding: 0.95rem; background: var(--azul); color: white; border: none; cursor: pointer; border-radius: var(--r-md); font-family: 'Mulish', sans-serif; font-size: 0.93rem; font-weight: 700; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
.btn-submit:hover { background: var(--azul-oscuro); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(47,95,143,0.2); }

/* ── SWITCH LINK ── */
.auth-switch { text-align: center; margin-top: 1.4rem; font-size: 0.82rem; color: var(--gris); }
.auth-switch a { color: var(--azul); font-weight: 600; text-decoration: none; }
.auth-switch a:hover { text-decoration: underline; }

/* ── PASSWORD STRENGTH (crear cuenta) ── */
.pwd-strength { margin-top: 0.4rem; }
.pwd-strength-bar { display: flex; gap: 3px; height: 3px; margin-bottom: 0.3rem; }
.pwd-bar-seg { flex: 1; border-radius: 2px; background: var(--gris-claro); transition: background 0.3s; }
.pwd-bar-seg.weak { background: var(--rojo); }
.pwd-bar-seg.medium { background: var(--ambar); }
.pwd-bar-seg.strong { background: var(--verde); }
.pwd-strength-label { font-size: 0.72rem; color: var(--gris); }

/* ── TERMS ── */
.terms-note { font-size: 0.74rem; color: var(--gris); line-height: 1.55; text-align: center; margin-top: 1rem; }
.terms-note a { color: var(--azul); text-decoration: none; }
.terms-note a:hover { text-decoration: underline; }


/* ── VOLVER (reubicado sobre la tarjeta) ── */
.auth-box { width: 100%; max-width: 440px; }
.auth-box .auth-card { max-width: none; }
.volver-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; color: var(--gris-calido); text-decoration: none; margin-bottom: 0.9rem; transition: color 0.2s; }
.volver-link:hover { color: var(--azul-oficio); }
.volver-link svg { width: 15px; height: 15px; stroke: currentColor; }

/* ── FOOTER ── */
footer { background: var(--tinta); color: rgba(255,255,255,0.68); padding: 4rem 8% 2rem; }
.footer-grid { display: grid; grid-template-columns: 2fr 1.4fr 1.6fr; gap: 4rem; padding-bottom: 2.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
.f-logo { font-family: var(--f-head); font-size: 1.6rem; font-weight: 600; color: #fff; display: block; margin-bottom: 0.8rem; }
.f-logo span { color: var(--arena); }
.footer-desc { font-size: 0.92rem; line-height: 1.7; margin-bottom: 0.4rem; }
.footer-slogan { font-size: 0.86rem; font-style: italic; font-family: var(--f-head); color: rgba(255,255,255,0.5); }
.f-col h4 { color: #fff; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 1.1rem; }
.f-col ul { list-style: none; display: flex; flex-direction: column; gap: 0.65rem; }
.f-col ul a { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
.f-col ul a:hover { color: var(--arena); }
.f-contact { display: flex; flex-direction: column; gap: 1.05rem; }
.f-ci-item { display: flex; gap: 0.7rem; align-items: flex-start; font-size: 0.9rem; }
.f-ci { color: var(--arena); margin-top: 0.05rem; flex-shrink: 0; display: flex; }
.f-ci svg { width: 18px; height: 18px; }
.f-ci-item a { color: rgba(255,255,255,0.6); text-decoration: none; transition: color 0.2s; }
.f-ci-item a:hover { color: #fff; }
.footer-bottom { padding-top: 1.6rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
.footer-bottom p { font-size: 0.8rem; color: rgba(255,255,255,0.4); }

/* ── FLOATING WA ── */
.wa-float {
  position: fixed; bottom: 26px; right: 26px; z-index: 999;
  width: 58px; height: 58px; background: var(--verde-wa); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 22px rgba(37,211,102,0.40);
  cursor: pointer; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s;
  animation: waPop 0.5s 0.8s ease both;
}
.wa-float:hover { transform: scale(1.08); box-shadow: 0 10px 30px rgba(37,211,102,0.50); }
.wa-float svg { width: 31px; height: 31px; fill: #fff; }
.wa-float-badge {
  position: absolute; top: -2px; right: -2px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--rojo); color: #fff; font-size: 0.65rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; border: 2px solid var(--crema);
}
.wa-float-tooltip {
  position: absolute; right: 70px; bottom: 50%; transform: translateY(50%);
  background: var(--tinta); color: #fff; font-size: 0.8rem; font-weight: 500;
  padding: 0.45rem 0.85rem; border-radius: 8px; white-space: nowrap;
  pointer-events: none; opacity: 0; transition: opacity 0.2s; box-shadow: var(--sh-md);
}
.wa-float-tooltip::after { content:''; position:absolute; left:100%; top:50%; transform:translateY(-50%); border:5px solid transparent; border-left-color:var(--tinta); }
.wa-float:hover .wa-float-tooltip { opacity: 1; }
@keyframes waPop { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }


/* ════════ RESPONSIVE GLOBAL APROBADO ════════ */
@media (max-width: 1199px) {
  .page-banner { padding: 2.6rem 6%; }
  .catalog-layout { grid-template-columns: 230px 1fr; }
  .catalog-main { padding: 1.8rem 1.8rem 4rem; }
  .products-grid { grid-template-columns: repeat(3, 1fr); }
  /* Header tablet: logo izquierda · iconos agrupados a la derecha con hamburguesa */
  .header-inner { padding: 0 6%; gap: 1rem; }
  .header-icons { margin-left: auto; gap: 0.35rem; }
  .nav-toggle { display: flex; }
  .mega-menu { display: none; }
  nav#mainNav {
    position: absolute; top: 100%; left: 0; right: 0;
    flex-direction: column; gap: 0; flex: none;
    background: var(--crema); border-bottom: 1px solid var(--linea);
    box-shadow: var(--sh-md); max-height: 0; overflow: hidden;
    transition: max-height 0.3s ease; padding: 0 6%;
  }
  nav#mainNav.open { max-height: 640px; padding: 0.4rem 6% 1rem; }
  nav#mainNav > a, nav#mainNav .nav-catalog-wrap > a {
    padding: 0.9rem 0; border-bottom: 1px solid var(--linea); font-size: 1rem;
  }
  nav#mainNav .nav-catalog-wrap { width: 100%; }
  nav#mainNav a::after, nav#mainNav a.active::after { display: none; }

  /* Catálogo como acordeón en tablet/móvil */
  nav#mainNav .nav-catalog-wrap > a { position: relative; }
  nav#mainNav .nav-catalog-wrap > a .mega-cat-arrow {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%) rotate(0deg);
    transition: transform 0.25s ease; width: 16px; height: 16px; color: var(--gris-calido);
  }
  nav#mainNav .nav-catalog-wrap.open > a .mega-cat-arrow { transform: translateY(-50%) rotate(180deg); }
  .mega-mobile {
    display: block; max-height: 0; overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .nav-catalog-wrap.open .mega-mobile { max-height: 520px; }
  .mega-mobile-cat {
    display: block; padding: 0.7rem 0 0.7rem 1rem;
    font-size: 0.95rem; color: var(--gris-calido);
    border-bottom: 1px solid var(--linea);
  }
  .mega-mobile-cat:last-child { border-bottom: none; }
  .mega-mobile-cat:hover { color: var(--azul-oficio); }
}

/* ── Sidebar colapsable (≤991px) ── */
@media (max-width: 991px) {
  .catalog-layout { grid-template-columns: 1fr; }
  .sidebar {
    position: static; height: auto; max-height: 0; overflow: hidden;
    border-right: none; border-bottom: 1px solid var(--linea);
    padding: 0 6%; transition: max-height 0.32s ease, padding 0.32s ease;
  }
  .sidebar.open { max-height: 1400px; padding: 1.6rem 6%; }
  .catalog-main { padding: 1.6rem 6% 4rem; }
  .filtros-toggle { display: inline-flex; }
  .products-grid { grid-template-columns: repeat(3, 1fr); }
}

/* ── Móvil (≤767px) ── */
@media (max-width: 767px) {
  body { font-size: 16px; }
  /* Topbar celular: 2 mensajes (envíos resumido), bucle 10s */
  .topbar-set-desktop { display: none; }
  .topbar-set-mobile { display: block; }
  .topbar-set-mobile .topbar-msg { font-size: 0.72rem; padding: 0 0.75rem; }
  .topbar-set-mobile .topbar-msg:nth-child(1) { animation: slideMsg 10s ease-in-out 0s infinite; }
  .topbar-set-mobile .topbar-msg:nth-child(2) { animation: slideMsg 10s ease-in-out 5s infinite; }
  /* Header móvil: padding lateral seguro, iconos agrupados a la derecha */
  .header-inner { padding: 0 6%; gap: 1rem; }

  .page-banner { padding: 2.2rem 6%; }
  .products-grid { grid-template-columns: repeat(2, 1fr); gap: 0.9rem; }
  .prod-body { padding: 0.85rem 0.9rem 1rem; }
  .prod-actions { flex-direction: column; }
  .btn-consultar { padding: 0.55rem 0; }
  .catalog-topbar { gap: 0.75rem; }
  .footer-grid { grid-template-columns: 1fr; gap: 2.2rem; }
  .footer-bottom { justify-content: center; }
  .wa-float { width: 54px; height: 54px; bottom: 18px; right: 18px; }
  .wa-float svg { width: 28px; height: 28px; }
  .wa-float-tooltip { display: none; }
}

/* ── Móvil pequeño (≤479px) ── */
@media (max-width: 479px) {
  .products-grid { grid-template-columns: 1fr; }
  .prod-img { aspect-ratio: 16 / 10; }
  .banner-count { width: 100%; text-align: center; }
}

/* ── RESPONSIVE DE SECCIÓN (Login) ── */
@media (max-width: 767px) {
  .auth-main { padding: 2rem 6%; }
  .auth-card { padding: 1.9rem 1.4rem; border-radius: var(--r-lg); }
  .auth-title { font-size: 1.35rem; }
}
</style>

<body>

<!-- MAIN -->
<div class="auth-main">

        </span>
        Continuar con Google

      <button class="btn-social">
        <span class="btn-social-icon">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2"/></svg>

    <div class="auth-divider"><span>o continúa con tu correo</span></div>

    <!-- TABS — solo para el formulario -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Iniciar sesión</button>
      <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Crear cuenta</button>
    </div>

    <!-- ① INICIAR SESIÓN -->
    <div class="auth-pane active" id="paneLogin">
      <div class="form-fields">
        <div class="form-group">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-input" placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <div class="input-wrap">
            <input type="password" class="form-input" id="loginPwd" placeholder="••••••••">
            <button class="pwd-toggle" onclick="togglePwd('loginPwd', this)" tabindex="-1">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.271,9.419C21.72,6.893,18.192,2.655,12,2.655S2.28,6.893.729,9.419a4.908,4.908,0,0,0,0,5.162C2.28,17.107,5.808,21.345,12,21.345s9.72-4.238,11.271-6.764A4.908,4.908,0,0,0,23.271,9.419Zm-1.705,4.115C20.234,15.7,17.219,19.345,12,19.345S3.766,15.7,2.434,13.534a2.918,2.918,0,0,1,0-3.068C3.766,8.3,6.781,4.655,12,4.655s8.234,3.641,9.566,5.811A2.918,2.918,0,0,1,21.566,13.534Z"/><path d="M12,7a5,5,0,1,0,5,5A5.006,5.006,0,0,0,12,7Zm0,8a3,3,0,1,1,3-3A3,3,0,0,1,12,15Z"/></svg>
            </button>

        </div>
        <div class="form-footer-row">
          <label class="remember-label"><input type="checkbox"> Recordarme</label>

      </div>
      <button class="btn-submit">Iniciar sesión</button>
    </div>

    <!-- ② CREAR CUENTA -->
    <div class="auth-pane" id="paneRegister">
      <div class="form-fields">
        <div class="form-group">
          <label class="form-label">Nombre completo</label>
          <input type="text" class="form-input" placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label class="form-label">Correo electrónico</label>

            <button class="pwd-toggle" onclick="togglePwd('registerPwd', this)" tabindex="-1">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.271,9.419C21.72,6.893,18.192,2.655,12,2.655S2.28,6.893.729,9.419a4.908,4.908,0,0,0,0,5.162C2.28,17.107,5.808,21.345,12,21.345s9.72-4.238,11.271-6.764A4.908,4.908,0,0,0,23.271,9.419Zm-1.705,4.115C20.234,15.7,17.219,19.345,12,19.345S3.766,15.7,2.434,13.534a2.918,2.918,0,0,1,0-3.068C3.766,8.3,6.781,4.655,12,4.655s8.234,3.641,9.566,5.811A2.918,2.918,0,0,1,21.566,13.534Z"/><path d="M12,7a5,5,0,1,0,5,5A5.006,5.006,0,0,0,12,7Zm0,8a3,3,0,1,1,3-3A3,3,0,0,1,12,15Z"/></svg>

<script>
// ── TABS ──
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.auth-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  document.getElementById('pane' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
}

// ── MOSTRAR/OCULTAR CONTRASEÑA ──
function togglePwd(id, btn) {
  const input = document.getElementById(id);
  const isText = input.type === 'text';
  input.type = isText ? 'password' : 'text';
  btn.innerHTML = isText
    ? '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.271,9.419C21.72,6.893,18.192,2.655,12,2.655S2.28,6.893.729,9.419a4.908,4.908,0,0,0,0,5.162C2.28,17.107,5.808,21.345,12,21.345s9.72-4.238,11.271-6.764A4.908,4.908,0,0,0,23.271,9.419Zm-1.705,4.115C20.234,15.7,17.219,19.345,12,19.345S3.766,15.7,2.434,13.534a2.918,2.918,0,0,1,0-3.068C3.766,8.3,6.781,4.655,12,4.655s8.234,3.641,9.566,5.811A2.918,2.918,0,0,1,21.566,13.534Z"/><path d="M12,7a5,5,0,1,0,5,5A5.006,5.006,0,0,0,12,7Zm0,8a3,3,0,1,1,3-3A3,3,0,0,1,12,15Z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.271,9.419A15.866,15.866,0,0,0,19.9,5.51l2.8-2.8a1,1,0,0,0-1.414-1.414L18.241,4.345A12.054,12.054,0,0,0,12,2.655C5.809,2.655,2.281,6.893.729,9.419a4.908,4.908,0,0,0,0,5.162A15.866,15.866,0,0,0,4.1,18.49l-2.8,2.8a1,1,0,1,0,1.414,1.414l3.052-3.052A12.054,12.054,0,0,0,12,21.345c6.191,0,9.719-4.238,11.271-6.764A4.908,4.908,0,0,0,23.271,9.419ZM2.433,13.534a2.918,2.918,0,0,1,0-3.068C3.767,8.3,6.782,4.655,12,4.655A10.1,10.1,0,0,1,16.766,5.82L14.753,7.833a4.992,4.992,0,0,0-6.92,6.92l-2.31,2.31A13.723,13.723,0,0,1,2.433,13.534ZM15,12a3,3,0,0,1-3,3,2.951,2.951,0,0,1-1.285-.3L14.7,10.715A2.951,2.951,0,0,1,15,12ZM9,12a3,3,0,0,1,3-3,2.951,2.951,0,0,1,1.285.3L9.3,13.285A2.951,2.951,0,0,1,9,12Zm12.567,1.534C20.233,15.7,17.218,19.345,12,19.345A10.1,10.1,0,0,1,7.234,18.18l2.013-2.013a4.992,4.992,0,0,0,6.92-6.92l2.31-2.31a13.723,13.723,0,0,1,3.09,3.529A2.918,2.918,0,0,1,21.567,13.534Z"/></svg>';
}

// ── FORTALEZA DE CONTRASEÑA ──
function checkStrength(val) {
  const segs = [document.getElementById('seg1'), document.getElementById('seg2'), document.getElementById('seg3')];
  const label = document.getElementById('pwdLabel');
  segs.forEach(s => { s.className = 'pwd-bar-seg'; });

  if (!val) { label.textContent = 'Ingresa una contraseña'; return; }

  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val) || /[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val) && val.length >= 10) score++;

  if (score <= 1) {
    segs[0].classList.add('weak');
    label.textContent = 'Contraseña débil';
  } else if (score === 2) {
    segs[0].classList.add('medium'); segs[1].classList.add('medium');
    label.textContent = 'Contraseña regular';
  } else {
    segs.forEach(s => s.classList.add('strong'));
    label.textContent = 'Contraseña segura';
  }
}
</script>
